[project]
name = "kitchen-record"
version = "0.1.0"
description = "Kitchen Inspection Record: a Minneapolis restaurant's inspection history against its neighbourhood, turned into the fix list the inspector checks next."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "requests>=2.32", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
