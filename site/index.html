<style>
/* Tokens from the msp-house-index prototype Aidan approved 2026-10-11. One colour per role a number plays:
   blue = yours, sand = your neighbours, amber = what the inspector checks / follow-up risk, green = the fix. */
:root{--bg:#f2f3f1;--card:#fff;--ink:#16191a;--mute:#646b6e;--line:#dcdfdd;--soft:#eef0ee;--accent:#245a86;--accentbg:#e3edf6;--good:#17784a;--goodbg:#e1f1e8;--bad:#b2402c;--badbg:#f8e6e1;--warn:#93600a;--warnbg:#faefd9;--evbg:#f3efe6;--evline:#dcd3c0;--evink:#5b4a2b;--evfill:#e6dcc5;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--cond:"IBM Plex Sans Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111414;--card:#1a1e1f;--ink:#e7ebec;--mute:#949c9f;--line:#2b3133;--soft:#202627;--accent:#7cb0dc;--accentbg:#16283a;--good:#5cc590;--goodbg:#15302a;--bad:#ec8a74;--badbg:#3a1f19;--warn:#e3aa52;--warnbg:#382a12;--evbg:#252219;--evline:#3a3427;--evink:#d9c7a3;--evfill:#3a3427;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111414;--card:#1a1e1f;--ink:#e7ebec;--mute:#949c9f;--line:#2b3133;--soft:#202627;--accent:#7cb0dc;--accentbg:#16283a;--good:#5cc590;--goodbg:#15302a;--bad:#ec8a74;--badbg:#3a1f19;--warn:#e3aa52;--warnbg:#382a12;--evbg:#252219;--evline:#3a3427;--evink:#d9c7a3;--evfill:#3a3427;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);padding:14px 16px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 24px/1.1 var(--cond);margin:0}
h2{font:700 18px/1.15 var(--cond);margin:0}
.lede{margin:4px 0 0;color:var(--mute);font-size:14px}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.lbl{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* search */
.search{position:relative}
.search input{width:100%;font:16px var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.hits{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9;max-height:320px;overflow:auto}
.hits:empty{display:none}
.hits button{all:unset;display:block;width:100%;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.hits button:last-child{border-bottom:0}
.hits button:hover,.hits button:focus-visible{background:var(--soft)}
.hits b{display:block;font-weight:600}
.hits span{color:var(--mute);font-size:13px}
.hits .none{padding:10px 14px;color:var(--mute);font-size:13.5px}
/* the restaurant */
.who{display:flex;flex-direction:column;gap:2px}
.who .nm{font:700 20px/1.15 var(--cond)}
.who .ad{color:var(--mute);font-size:13.5px}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tile b{font:600 22px/1.1 var(--mono)}
.tile span{font-size:12.5px;color:var(--mute);line-height:1.25}
.tile.me{background:var(--accentbg);border-color:var(--accent)}.tile.me b{color:var(--accent)}
.tile.peer{background:var(--evbg);border-color:var(--evline)}.tile.peer b{color:var(--evink)}
.chart{margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:6px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;border:1px solid;display:inline-block}
.key .k-me i{background:var(--accent);border-color:var(--accent)}
.key .k-fu i{background:var(--card);border-color:var(--accent);border-radius:50%}
.key .k-peer i{background:var(--evfill);border-color:var(--evline)}
.top{margin-top:12px;border-left:3px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.top .big{font:600 17px/1.25 var(--sans)}
.top p{margin:0;font-size:13.5px;color:var(--mute)}
.top .code{font:12px var(--mono);color:var(--mute)}
.counts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mute)}
.counts b{color:var(--ink);font-family:var(--mono)}
/* the paid part */
.paid{display:flex;flex-direction:column;gap:12px}
.lock{position:relative}
.lock .blur{filter:blur(4px);pointer-events:none;user-select:none;opacity:.7}
.lock .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.lock .over div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.fix{display:flex;flex-direction:column;gap:10px}
.fx{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fx .h{padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--soft)}
.fx .h b{font:600 15px var(--sans)}
.fx .h span{font:12px var(--mono);color:var(--mute);white-space:nowrap}
.fx .b{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.fx .row{display:grid;grid-template-columns:92px 1fr;gap:8px}
.fx .row .lbl{padding-top:2px}
.fx .row.chk .lbl{color:var(--warn)}.fx .row.do .lbl{color:var(--good)}
.fx .row.do{background:var(--goodbg);margin:0 -12px -10px;padding:8px 12px 10px;border-top:1px solid var(--line)}
.fx q{display:block;color:var(--mute);font-size:13px;font-style:italic}
.fx q::before,.fx q::after{content:"\201C"}.fx q::after{content:"\201D"}
.fx .qd{font:11.5px var(--mono);color:var(--mute);font-style:normal}
.risk{border-left:3px solid var(--warn);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.risk .big{font:700 24px/1.1 var(--cond);color:var(--warn)}
.risk p{margin:0;font-size:13.5px}
.risk p.m{color:var(--mute);font-size:13px}
.peers{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font:13px var(--mono);font-variant-numeric:tabular-nums;width:100%;min-width:560px}
th{position:sticky;top:0;background:var(--soft);font:600 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);max-width:220px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--card);box-shadow:1px 0 0 var(--line)}
th:first-child{background:var(--soft)}
tr.me td{background:var(--accentbg);font-weight:600}tr.me td:first-child{background:var(--accentbg)}
td.lo{color:var(--bad)}td.hi{color:var(--good)}
.more{all:unset;cursor:pointer;color:var(--accent);font-size:13.5px;padding:8px 0}
/* offer */
.offer{display:flex;flex-direction:column;gap:10px}
.offer .price{font-size:15px}
.offer .price b{font:700 20px var(--cond)}
.btn{font:600 16px var(--sans);padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{all:unset;cursor:pointer;color:var(--accent);font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.pwf{display:flex;gap:8px;flex-wrap:wrap}
.pwf input{flex:1 1 180px;font:16px var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-transform:uppercase}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.unlocked{border-left:3px solid var(--good);padding-left:10px;font-size:13.5px}
.unlocked b{color:var(--good)}
#co{min-height:0}
foot{display:block;font-size:12.5px;color:var(--mute);line-height:1.5}
@media (min-width:760px){body{padding-top:28px}h1{font-size:30px}.verdict{grid-template-columns:repeat(4,1fr)}.tile b{font-size:24px}.fx .row{grid-template-columns:120px 1fr}}
</style>
</head>

<script>
(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PK="pk_live_51TUvvcBzD4mN8eOD28H6oQkFwFHwF1SLtWxN1vHRmnSxntWFefgd33mEIVmjv8ekxWgkZft3OpPlzmVXMIeHPBwj003998hjTf";
const track=(name,data)=>{try{window.va("event",{name,data:data||{}})}catch(e){}try{window.posthog&&posthog.capture(name,data||{})}catch(e){}};
const fmtd=d=>{const [y,m,dd]=d.split("-");return new Date(+y,+m-1,+dd).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
const fmtm=d=>{const [y,m]=d.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-US",{month:"short",year:"2-digit"})};
const pct=x=>Math.round(x*100);
const nice=s=>String(s||"").toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\b(Ne|Nw|Se|Sw|Llc|Bbq|Dq|Ii|Iii)\b/g,m=>m.toUpperCase()).replace(/'S\b/g,"'s");

const F=await fetch("/data/free.json").then(r=>r.json());
const M=F.meta, ROWS=F.rows, NB=F.nb, byId=Object.fromEntries(ROWS.map(r=>[r.id,r]));
let variant="", token="";
const mfor=/^\/for\/([A-Za-z0-9_-]+)\/?$/.exec(location.pathname);
let openId=null;
if(mfor){token=mfor[1];try{const T=await fetch("/for.json").then(r=>r.json());if(T[token]){openId=T[token].id;variant=T[token].v||""}}catch(e){}}
const Q=new URLSearchParams(location.search);
if(!openId&&Q.get("id")&&byId[Q.get("id")])openId=Q.get("id");
if(!openId){try{const l=localStorage.getItem("kr_last");if(l&&byId[l])openId=l}catch(e){}}
if(!openId)openId=M.example;
track("preview_open",{variant,token:token?"yes":"no",id:openId});

$("#pricep").innerHTML=`<b>$${M.price_usd}</b>, once. It unlocks the fix list, the follow-up risk and the named peer table for any of the <b style="font:inherit">${M.n_restaurants.toLocaleString("en-US")}</b> Minneapolis restaurants here.`;
$("#foot").innerHTML=`Source: City of Minneapolis Open Data, Food Inspections (public record), ${M.n_routine.toLocaleString("en-US")} routine inspections of ${M.n_restaurants.toLocaleString("en-US")} restaurants, ${fmtd(M.first)} to ${fmtd(M.last)}, pulled ${fmtd(M.pulled_on)}. Scores and the follow-up rule are the city's; the plain-English fixes are ours. Every number on this page is computed from that file. <a href="https://brickandmortar.dev/">Brick &amp; Mortar</a>.`;

// ---- search
const norm=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const IDX=ROWS.map(r=>({r,n:norm(r.name),a:norm(r.address)}));
function search(q){
  q=norm(q); if(q.length<2)return[];
  const toks=q.split(" ");
  const sc=IDX.map(x=>{let s=0;for(const t of toks){if(x.a.startsWith(t))s+=3;else if(x.a.includes(t))s+=2;if(x.n.includes(t))s+=2}if(x.a.startsWith(q))s+=6;if(x.n.startsWith(q))s+=5;return[s,x.r]}).filter(x=>x[0]>=2*toks.length);
  sc.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name));
  return sc.slice(0,8).map(x=>x[1]);
}
$("#q").addEventListener("input",e=>{
  const v=e.target.value, hits=search(v), H=$("#hits");
  if(norm(v).length<2){H.innerHTML="";return}
  H.innerHTML=hits.length?hits.map(r=>`<button type="button" role="option" data-id="${r.id}"><b>${esc(nice(r.name))}</b><span>${esc(nice(r.address))} · ${esc(r.nb||"")}</span></button>`).join(""):`<div class="none">No Minneapolis restaurant matches that. Try the street number and name, like "2450 Nicollet".</div>`;
  track("search",{n:hits.length});
});
$("#hits").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("#hits").innerHTML="";$("#q").value="";open(b.dataset.id,"search")});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#hits").innerHTML=""});

// ---- the free slice
function chart(r,peer){
  const W=640,H=220,L=34,R=10,T=14,B=30, ys=60, ye=100;
  const h=r.hist; if(!h.length)return"";
  const t0=new Date(h[0].d).getTime(), t1=new Date(h[h.length-1].d).getTime(), span=Math.max(t1-t0, 90*864e5);
  const x=d=>L+(new Date(d).getTime()-t0)/span*(W-L-R);
  const y=s=>T+(ye-Math.max(ys,s))/(ye-ys)*(H-T-B);
  const band=peer?`<rect x="${L}" y="${y(peer.p90)}" width="${W-L-R}" height="${Math.max(2,y(peer.p10)-y(peer.p90))}" fill="var(--evfill)" opacity=".8"/><line x1="${L}" x2="${W-R}" y1="${y(peer.p50)}" y2="${y(peer.p50)}" stroke="var(--evink)" stroke-width="1.5" stroke-dasharray="4 3"/>`:"";
  const rt=h.filter(p=>p.t==="R");
  const line=rt.length>1?`<polyline points="${rt.map(p=>`${x(p.d)},${y(p.s)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:"";
  const dots=h.map(p=>p.t==="R"?`<circle cx="${x(p.d)}" cy="${y(p.s)}" r="5.5" fill="var(--accent)"><title>${fmtd(p.d)}: routine, scored ${p.s}, ${p.p1} Priority-1</title></circle>`:`<circle cx="${x(p.d)}" cy="${y(p.s)}" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>${fmtd(p.d)}: ${p.t==="F"?"follow-up":"verification"}, scored ${p.s}</title></circle>`).join("");
  const labels=rt.map(p=>`<text x="${x(p.d)}" y="${y(p.s)-10}" text-anchor="middle" font-size="12" font-family="var(--mono)" font-weight="600" fill="var(--accent)">${p.s}</text>`).join("");
  const grid=[60,70,80,90,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" font-family="var(--mono)" fill="var(--mute)">${v}</text>`).join("");
  const rule=`<line x1="${L}" x2="${W-R}" y1="${y(M.rule_score+.5)}" y2="${y(M.rule_score+.5)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="2 3"/><text x="${W-R}" y="${y(M.rule_score+.5)+12}" text-anchor="end" font-size="10.5" font-family="var(--mono)" fill="var(--warn)">follow-up at ${M.rule_score} or below</text>`;
  const years=[...new Set(h.map(p=>p.d.slice(0,4)))].map(yr=>{const pts=h.filter(p=>p.d.startsWith(yr));return`<text x="${(x(pts[0].d)+x(pts[pts.length-1].d))/2}" y="${H-8}" text-anchor="middle" font-size="11.5" font-family="var(--mono)" fill="var(--mute)">${yr}</text>`}).join("");
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your inspection scores over time against the neighbourhood spread">${grid}${band}${rule}${line}${dots}${labels}${years}</svg>`;
}
function renderFree(r){
  const peer=NB[r.nb], ps=peer?peer:M.city, pname=peer?`${r.nb} (${peer.n} restaurants)`:`Minneapolis (${M.n_restaurants.toLocaleString("en-US")} restaurants; ${r.nb||"this neighbourhood"} has too few to compare)`;
  const last=r.last, rank=last&&peer?pctRank(r):null;
  const where=last?(last.s<=ps.p10?`in the bottom tenth of ${peer?r.nb:"Minneapolis"}`:last.s>=ps.p90?`in the top tenth of ${peer?r.nb:"Minneapolis"}`:last.s<ps.p50?`below the ${peer?r.nb:"Minneapolis"} median`:`at or above the ${peer?r.nb:"Minneapolis"} median`):"";
  $("#free").innerHTML=`
   <div class="who"><div class="lbl">Your record</div><div class="nm">${esc(nice(r.name))}</div><div class="ad">${esc(nice(r.address))}, Minneapolis · ${esc(r.nb||"")} · city risk level ${esc(r.risk_level||"?")}</div></div>
   ${last?`<div class="verdict">
     <div class="tile me"><b>${last.s}</b><span>your last routine score, ${fmtd(last.d)}; ${last.p1} Priority-1 line${last.p1===1?"":"s"}</span></div>
     <div class="tile peer"><b>${ps.p50}</b><span>median in ${esc(peer?r.nb:"Minneapolis")}</span></div>
     <div class="tile peer"><b>${ps.p10}</b><span>bottom tenth scores this or lower</span></div>
     <div class="tile peer"><b>${ps.p90}</b><span>top tenth scores this or higher</span></div>
   </div><p style="margin:10px 0 0;font-size:14px">That puts you <b>${where}</b>. ${pct(ps.p1_rate)} in 100 routine visits ${peer?"in "+esc(r.nb):"in Minneapolis"} carry at least one Priority-1 line.</p>`:`<p>No routine inspection on record since 2023.</p>`}
   <div class="chart">${chart(r,peer)}<div class="key"><span class="k-me"><i></i>your routine scores</span><span class="k-fu"><i></i>follow-up visits</span><span class="k-peer"><i></i>${esc(pname)}: bottom tenth to top tenth, dashed = median</span></div></div>
   ${r.top?`<div class="top"><div class="lbl">The line the inspector keeps writing</div><div class="big">${esc(r.top.short)}</div><p>${esc(r.top.plain)}</p><p>Written on <b style="color:var(--ink)">${r.top.times}</b> of your visits, last on ${fmtd(r.top.last)}. ${r.top.n_city} Minneapolis restaurants have had this line too.</p><div class="code">${esc(r.top.code)}</div></div>`:`<div class="top"><div class="lbl">Repeated Priority-1 lines</div><div class="big">None</div><p>No Priority-1 code appears on two or more of your inspections. ${M.n_repeat} of ${M.n_restaurants.toLocaleString("en-US")} Minneapolis restaurants have at least one.</p></div>`}
   <div class="counts"><span><b>${r.n_rep}</b> repeated Priority-1 line${r.n_rep===1?"":"s"}</span><span><b>${r.n_fu}</b> follow-up visit${r.n_fu===1?"":"s"} since 2023</span><span><b>${r.hist.filter(p=>p.t==="R").length}</b> routine inspections</span></div>`;
}
function pctRank(r){return null}

// ---- the paid part
let PW=null, FULL={};
try{PW=localStorage.getItem("kr_pw")}catch(e){}
function lockedShell(r){
  const n=Math.max(1,r.n_rep);
  const fake=Array.from({length:Math.min(3,n)},(_,i)=>`<div class="fx"><div class="h"><b>${i===0&&r.top?esc(r.top.short):"Repeated Priority-1 line"}</b><span>written ${i===0&&r.top?r.top.times:2}×</span></div><div class="b"><div class="row chk"><span class="lbl">Inspector checks</span><span>Puts a probe thermometer into the food on your cold line and reads the cooler's own thermometer.</span></div><div class="row do"><span class="lbl">Do this</span><span>Put a thermometer in every cooler and check it twice a shift. Keep lids on the inserts.</span></div></div></div>`).join("");
  $("#paid").innerHTML=`
   <div class="card lock"><div class="blur"><h2>Your fix list</h2><p class="lede">Each repeated line: what the inspector checks on the follow-up, and what to do before it.</p><div class="fix" style="margin-top:10px">${fake}</div></div><div class="over"><div><b>${r.n_rep} repeated line${r.n_rep===1?"":"s"}</b> with what the inspector checks and what to do, in plain words. In the full record, $${M.price_usd}.</div></div></div>
   <div class="card lock"><div class="blur"><h2>Will they come back?</h2><div class="risk" style="margin-top:8px"><div class="big">88 in 100</div><p>restaurants that scored like you got a follow-up visit within 45 days.</p></div></div><div class="over"><div>Your follow-up risk, from the city's own rule and ${M.n_routine.toLocaleString("en-US")} inspections. In the full record.</div></div></div>
   <div class="card lock"><div class="blur"><h2>${esc(r.nb||"Your neighbourhood")}, named</h2><div class="peers" style="margin-top:8px"><table><thead><tr><th>Restaurant</th><th>Last score</th><th>Date</th><th>P1 lines</th><th>Repeated</th><th>Follow-ups</th></tr></thead><tbody>${[1,2,3,4].map(i=>`<tr><td>Neighbour ${i}</td><td>9${i}</td><td>Mar 2026</td><td>${i%3}</td><td>${i%2}</td><td>${i%2}</td></tr>`).join("")}</tbody></table></div></div><div class="over"><div>Every restaurant in ${esc(NB[r.nb]?r.nb:"Minneapolis")} by name, with its last score, repeated lines and follow-ups. In the full record.</div></div></div>`;
}
function renderPaid(r,d){
  const fix=d.fix.length?d.fix.map(x=>`<div class="fx"><div class="h"><b>${esc(x.short)}</b><span>written ${x.times}× · last ${fmtd(x.last)}</span></div><div class="b">
    <div>${esc(x.plain)} <span class="qd">${esc(x.code)} · ${x.n_city} Minneapolis restaurants have had it</span></div>
    ${x.comments.length?`<q>${esc(x.comments[0].c)} <span class="qd">— the inspector, ${fmtd(x.comments[0].d)}</span></q>`:""}
    <div class="row chk"><span class="lbl">Inspector checks</span><span>${esc(x.checks)}</span></div>
    <div class="row do"><span class="lbl">Do this</span><span>${esc(x.fix)}</span></div></div></div>`).join(""):`<p>No Priority-1 code repeats in your record. Your fix list is the single lines on your last report.</p>`;
  const k=d.risk;
  const risk=k?`<div class="risk"><div class="big">${pct(k.rate)} in 100</div><p>Minneapolis restaurants whose last routine score was ${k.band==="le"?`${k.rule} or below`:`above ${k.rule}`}, like your ${k.last_score} on ${fmtd(k.last_date)}, got a follow-up visit within ${k.window_days} days (${pct(k.rate_le)} in 100 at ${k.rule} or below; ${pct(k.rate_gt)} in 100 above it).</p>
    <p>The city's rule: a follow-up is done when a routine score is <b>${k.rule} or lower</b>, about 14 days later, to check the fixes. Each Priority-1 line costs 4 points.</p>
    <p>If the inspector writes your ${d.fix.length} repeated line${d.fix.length===1?"":"s"} again and nothing else, your next score is <b>${k.if_repeated_score}</b>: ${k.if_repeated_followup?"a follow-up visit.":"no follow-up on those alone, but one more Priority-1 line changes that."}</p>
    <p class="m">You have had ${k.n_followups} follow-up visit${k.n_followups===1?"":"s"} across ${k.n_routine} routine inspections since 2023.</p></div>`:"";
  const peers=d.peers, me=peers.findIndex(p=>p.me);
  const rowHtml=p=>`<tr class="${p.me?"me":""}"><td>${esc(nice(p.name))}${p.me?" (you)":""}</td><td class="${p.last_score<=M.rule_score?"lo":p.last_score>=M.city.p90?"hi":""}">${p.last_score}</td><td>${fmtm(p.last_date)}</td><td>${p.p1}</td><td>${p.n_rep}</td><td>${p.n_fu}</td></tr>`;
  let shown=Math.min(peers.length,Math.max(25,me+6));
  const table=()=>`<table><thead><tr><th>Restaurant</th><th>Last score</th><th>Date</th><th>P1 lines</th><th>Repeated</th><th>Follow-ups</th></tr></thead><tbody>${peers.slice(0,shown).map(rowHtml).join("")}</tbody></table>`;
  $("#paid").innerHTML=`
   <div class="card"><h2>Your fix list</h2><p class="lede">Each repeated Priority-1 line: what the inspector checks on the follow-up, and what to do before it. The quote is the inspector's own last comment.</p><div class="fix" style="margin-top:10px">${fix}</div></div>
   <div class="card"><h2>Will they come back?</h2><div style="margin-top:8px">${risk}</div></div>
   <div class="card"><h2>${esc(d.peer_set)}, named</h2><p class="lede">${peers.length} restaurants, best last score first. Red = at or under the follow-up line; green = top tenth of the city.</p><div class="peers" style="margin-top:8px" id="peert">${table()}</div>${shown<peers.length?`<button class="more" id="more">Show all ${peers.length}</button>`:""}</div>`;
  const mb=$("#more"); if(mb)mb.onclick=()=>{shown=peers.length;$("#peert").innerHTML=table();mb.remove()};
}
async function unlock(pw,src){
  const r=await fetch("/api/data?id="+encodeURIComponent(cur),{headers:{"x-password":pw}});
  if(r.status===401||r.status===402){const j=await r.json().catch(()=>({}));throw new Error(j.error||"That password didn't match.")}
  if(!r.ok)throw new Error("Couldn't open the record right now. Try again in a minute.");
  const d=await r.json(); FULL[cur]=d; PW=pw; try{localStorage.setItem("kr_pw",pw)}catch(e){}
  track("unlock",{via:src,kind:r.headers.get("X-Access")||""});
  renderPaid(byId[cur],d);
  $("#offer").querySelector("h2").textContent="Unlocked";
  $("#pricep").innerHTML=`<span class="unlocked"><b>Your password is saved on this device.</b> Look up any other Minneapolis restaurant above; its full record opens too.</span>`;
  $("#buy").hidden=true;$("#havepw").hidden=true;$("#pwf").hidden=true;$("#err").textContent="";
}
let cur=null;
async function open(id,src){
  const r=byId[id]; if(!r)return; cur=id; try{localStorage.setItem("kr_last",id)}catch(e){}
  renderFree(r);
  if(src!=="init"){track("open_restaurant",{via:src});history.replaceState(null,"",`/?id=${id}`)}
  if(FULL[id]){renderPaid(r,FULL[id]);return}
  lockedShell(r);
  if(PW){try{await unlock(PW,"saved")}catch(e){PW=null;try{localStorage.removeItem("kr_pw")}catch(x){}}}
}

// ---- offer
$("#havepw").onclick=()=>{const f=$("#pwf"),on=f.hidden;f.hidden=!on;$("#havepw").setAttribute("aria-expanded",on);if(on){$("#pw").focus();track("password_open")}};
$("#pwf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button"),v=$("#pw").value.trim();if(!v){$("#err").textContent="Enter the password from your email.";return}b.disabled=true;$("#err").textContent="";try{await unlock(v,"form");$("#paid").scrollIntoView({behavior:"smooth"})}catch(x){$("#err").textContent=x.message}finally{b.disabled=false}};
let CO=null;
const loadStripe=()=>window.Stripe?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://js.stripe.com/dahlia/stripe.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
$("#buy").onclick=async()=>{
  const b=$("#buy"); track("checkout_open",{variant});
  if(CO){$("#co").scrollIntoView({behavior:"smooth"});return}
  b.disabled=true;const t=b.textContent;b.textContent="Loading secure checkout…";
  try{await loadStripe();const st=window.Stripe(PK);
    const opts={fetchClientSecret:()=>fetch("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:cur,token})}).then(r=>r.json()).then(j=>{if(!j.clientSecret)throw new Error(j.error||"Checkout could not start.");return j.clientSecret})};
    CO=await(st.createEmbeddedCheckoutPage?st.createEmbeddedCheckoutPage(opts):st.initEmbeddedCheckout(opts));
    CO.mount("#co");setTimeout(()=>$("#co").scrollIntoView({behavior:"smooth",block:"start"}),300);
  }catch(x){CO=null;$("#err").textContent="Checkout didn't load. Refresh and try again, or email aidan@brickandmortar.dev."}
  finally{b.disabled=false;b.textContent=t}
};
async function confirmPaid(id){
  const box=$("#paidmsg");box.hidden=false;$("#buy").hidden=true;box.innerHTML="<b>Checking your payment…</b>";
  for(let i=0;i<6;i++){
    try{const j=await fetch("/api/session-status?session_id="+encodeURIComponent(id)).then(r=>r.json());
      if(j.paid){box.innerHTML=`<b>Check your email for your password.</b> ${j.email?`Sent to <b>${esc(j.email)}</b>. `:""}Your receipt comes from Stripe, and the invoice carries the password too. Have it? Enter it under "Have a password?".`;$("#pwf").hidden=false;$("#havepw").hidden=true;track("paid",{variant});return}
      if(j.status==="expired"||j.error)break;
    }catch(e){}
    await new Promise(r=>setTimeout(r,2500));
  }
  box.innerHTML=`<b>We couldn't confirm that payment yet.</b> If you were charged, the password is on its way to your email. Otherwise refresh and try again, or write to aidan@brickandmortar.dev.`;
}

// ---- start
await open(openId,"init");
if(Q.get("pw")){try{await unlock(Q.get("pw"),"link")}catch(e){$("#err").textContent=e.message}history.replaceState(null,"",location.pathname)}
if(Q.get("paid"))confirmPaid(Q.get("paid"));
})();
</script>
